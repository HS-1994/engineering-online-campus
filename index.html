<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1724" />
    <meta name="description" content="Engineering Online Campus — personal multidisciplinary engineering university." />
    <title>Engineering Online Campus</title>
    <link rel="stylesheet" href="styles.css?v=20260823-02" />
    <link rel="stylesheet" href="styles-overrides.css?v=20260823-02" />
    <link rel="stylesheet" href="campus-v2.css?v=20260823-02" />
    <link rel="stylesheet" href="final-v3.css?v=20260823-02" />
    <style>
      .explorer-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}.small{padding:7px 10px!important;font-size:12px!important}.plan-launcher{position:fixed;right:22px;bottom:22px;z-index:9998;border:1px solid rgba(255,255,255,.16);background:#152338;color:#fff;border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:0 12px 32px rgba(0,0,0,.3);cursor:pointer}.plan-launcher span{display:inline-grid;place-items:center;min-width:22px;height:22px;margin-left:5px;border-radius:999px;background:#2f79ff;font-size:11px}.course-plan-panel{display:none;position:fixed;inset:0;z-index:10000}.course-plan-panel.open{display:block}.plan-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(3px)}.plan-drawer{position:absolute;right:0;top:0;height:100%;width:min(560px,94vw);background:#0e1724;color:#fff;border-left:1px solid rgba(255,255,255,.12);padding:26px;overflow:auto;box-shadow:-20px 0 50px rgba(0,0,0,.35)}.plan-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid rgba(255,255,255,.1);padding-bottom:18px;margin-bottom:18px}.plan-list{display:grid;gap:12px}.plan-item{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.035);border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:14px;align-items:center}.plan-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.plan-foot{display:flex;gap:8px;margin-top:18px}.start-course-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 15px;border:0;border-radius:11px;background:linear-gradient(135deg,#63d8ff,#8f9bff);color:#07111b;font-weight:900;cursor:pointer}.start-course-btn.started{background:rgba(114,228,188,.14);color:#72e4bc;border:1px solid rgba(114,228,188,.25);cursor:default}.course-status-pill{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:.68rem;border:1px solid rgba(196,220,240,.12);color:#9fb0bf}.course-status-pill.started{color:#72e4bc;border-color:rgba(114,228,188,.25);background:rgba(114,228,188,.07)}
      @media(max-width:700px){.explorer-actions{width:100%;justify-content:flex-start;margin-top:8px}.plan-launcher{right:12px;bottom:12px}.plan-drawer{padding:18px}.plan-item{align-items:flex-start;flex-direction:column}.plan-actions{justify-content:flex-start}}
    </style>

  </body>
